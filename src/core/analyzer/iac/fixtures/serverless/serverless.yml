service: orders

provider:
  name: aws
  runtime: nodejs20.x
  environment:
    TABLE_NAME: orders-table

functions:
  createOrder:
    handler: src/orders.create
    events:
      - httpApi: 'POST /orders'
  getOrder:
    handler: src/orders.get
    runtime: nodejs18.x
  imageFn:
    image: my-ecr-image
