# Dependabot configuration.
#
# Dependabot SECURITY updates (advisory-driven) are enabled in repo settings and are
# deliberately NOT grouped below — each arrives as its own PR so a fix can be reviewed
# and landed fast. What this file adds is scheduled VERSION updates, grouped to keep the
# routine noise to a few reviewable PRs a week.
#
# The `github-actions` ecosystem is the important half. Every action in this repo is
# pinned to an immutable commit SHA (a tag can be moved to point at new code, a SHA
# cannot), and a pinned SHA only stays safe if something keeps proposing the upgrade.
# That something is this file.

version: 2

updates:
  # ---------------------------------------------------------------- npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      # One PR for routine dev-tooling drift (eslint, vitest, tsx, types).
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      # One PR for low-risk runtime drift. Majors stay individual: they are the ones
      # that can change behavior, so they deserve their own review and CI run.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
    # Do not use `ignore` for the ABI-sensitive parser/vector stack. Dependabot
    # applies ignores to security updates too, so suppressing routine version PRs
    # here would also suppress advisory fixes on the highest-risk native input
    # surface. Review those updates individually and close incompatible version
    # bumps after the parser/ABI fixtures run.

  # ------------------------------------------------------- github actions
  # Two entries, because one does not cover both places actions are referenced.
  #
  # `directory: /` covers `.github/workflows/*` ONLY. The composite action at
  # `.github/actions/openlore-review/action.yml` is a separate Dependabot directory and
  # was silently unmonitored — the first github-actions PR (#270) bumped every workflow
  # to checkout v7 / setup-node v7 and left the composite action on setup-node v4.4.0
  # and github-script v7.1.0. Actions there are pinned to commit SHAs like everywhere
  # else, and a pinned SHA with nothing proposing upgrades just freezes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /.github/actions/openlore-review
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composite-action:
        applies-to: version-updates
        patterns: ['*']
