name: 'OpenLore CodeQL config'

# `security-extended` over the default suite: it adds the lower-precision security
# queries, which is the right trade for a tool whose whole job is reading untrusted
# repository contents (paths, source text, git output, YAML/JSON from analyzed repos).
# `security-and-quality` is deliberately NOT used — it folds in maintainability
# queries, and a baseline that reports style as "security" gets tuned out.
queries:
  - uses: security-extended

# ---------------------------------------------------------------------------
# Scope policy
#
# Everything excluded below is excluded for one reason: it is not part of the
# shipped program, so a dataflow SOURCE inside it describes a scenario that cannot
# occur in the artifact users run.
#
# Findings are NOT suppressed by rule. A stable, reviewed sink whose behavior is
# essential may carry a query-specific inline suppression with its reason next to
# it. All other accepted findings are dismissed individually in the Security tab
# with a stated reason. Both approaches keep the rule guarding new code instead of
# going quiet everywhere.
# ---------------------------------------------------------------------------
paths-ignore:
  # ---- test code -----------------------------------------------------------
  # Not shipped (the `files` allowlist omits it and `npm run audit:packlist`
  # enforces that), not reachable by anything but the test runner — and its
  # fixtures are what made the first baseline unreadable.
  #
  # 368 of 458 alerts were IN test files, and the largest rule by a wide margin
  # (js/insecure-temporary-file, 379 alerts) fires on `writeFile(join(tmpdir(), …))`
  # in fixtures. That taint also flowed INTO production sinks: 30 further alerts
  # landed on production `writeFile` calls whose path arrived from a test caller.
  # gitignore-manager.ts was reported that way despite containing no reference to
  # `tmpdir()` at all — in production those paths are the user's repository root.
  #
  # So this removes a source of noise AND of misattribution. Writing into a
  # per-test temp directory is the correct thing for a test to do.
  - '**/*.test.ts'
  - '**/*.spec.ts'

  # ---- sample corpora ------------------------------------------------------
  # `examples/` holds self-contained SAMPLE APPLICATIONS (drift-demo, the opencode
  # plugins) that exist to be analyzed BY OpenLore in demos and tests. Findings there
  # describe the sample, not OpenLore: the two js/missing-rate-limiting alerts in the
  # first baseline were about drift-demo's Express routes, which are deliberately a
  # small imperfect app. Scanning them measures the fixture, not the product.
  - examples

  # ---- fixtures and vendored code -----------------------------------------
  # Deliberately malformed / adversarial inputs that exist to be parsed by tests.
  # Scanning them reports the fixture, never the code under test.
  - src/core/analyzer/fixtures
  - src/core/analyzer/iac/fixtures
  # (its Dockerfile is intentionally unpinned so the IaC projector has input —
  #  Scorecard reports that as an unpinned dependency; it is a fixture, not our CI)
  - src/core/scip/fixtures
  # Third-party protobuf runtime shipped as-is; upgrades come from upstream, and
  # advisories against it are dependency-scanning's job, not SAST's.
  - src/core/scip/vendor
